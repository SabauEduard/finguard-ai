name: finguard-ai

services:
  postgres:
    image: pgvector/pgvector:pg18-trixie
    container_name: finguard-ai-postgres
    restart: unless-stopped
    environment:
      TZ: UTC
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      FG_DB_NAME: ${FG_DB_NAME}
      FG_DB_APP_USER: ${FG_DB_APP_USER}
      FG_DB_APP_PASSWORD: ${FG_DB_APP_PASSWORD}
    ports:
      - ${POSTGRES_PORT}:5432
    volumes:
      - finguard-ai-postgres-data:/var/lib/postgresql
      - ./init/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  finguard-ai-postgres-data:
